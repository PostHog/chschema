{{define "content"}}
<h1>{{.Heading}}</h1>
{{if .ObjectDiffHref}}<p class="schema-actions"><a class="summary-link" href="{{.ObjectDiffHref}}">Review object differences</a></p>{{end}}
{{if not .Groups}}<p class="muted">{{.Empty}}</p>{{end}}
{{range .Groups}}
<section class="db">
  <h2>{{.Env}}</h2>
  <ul class="objlist">
    {{range .Schemas}}<li><a href="{{.Href}}">{{.Role}}</a></li>{{end}}
  </ul>
</section>
{{end}}
{{end}}
